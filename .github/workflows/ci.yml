name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict null-check (ratcheted scope)
        run: npm run typecheck:strict

      - name: Edge function syntax
        run: npm run check:functions

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
